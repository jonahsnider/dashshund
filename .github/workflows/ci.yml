name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build and check

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - name: Add npm global binaries to PATH
        run: echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
      - parallel:
          - name: Check formatting
            run: pnpm format
          - name: Lint
            run: pnpm lint
          - name: Check unused code and dependencies
            uses: fallow-rs/fallow@57325d871dfae9cf383db5b27a0dec166b885135 # v3.50.0
          - name: Build frontend
            run: pnpm build:frontend
