name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build and check

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - parallel:
          - name: Check formatting
            run: pnpm format
          - name: Lint
            run: pnpm lint
          - name: Check unused code and dependencies
            uses: fallow-rs/fallow@v3.34.1
          - name: Build frontend
            run: pnpm build:frontend
