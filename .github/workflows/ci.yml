name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build and lint

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - parallel:
          - name: Check formatting
            run: pnpm format
          - name: Lint
            run: pnpm lint
          - name: Check unused code and dependencies
            uses: fallow-rs/fallow@v3.34.1
          - name: Build frontend
            run: pnpm build:frontend
