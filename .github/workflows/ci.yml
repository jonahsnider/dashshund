name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build and lint

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
      - name: Add npm global binaries to PATH
        run: echo "$(npm prefix --global)/bin" >> "$GITHUB_PATH"
      - parallel:
          - name: Lint
            run: pnpm lint
          - name: Detect unused code
            uses: fallow-rs/fallow@v3.34.1
          - name: Build frontend
            run: pnpm build:frontend
